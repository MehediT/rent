name: CI - Kubernetes Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Tests
        run: |
          cd ./MyService
          chmod +x gradlew
          ./gradlew test

      - name: Generate JaCoCo Report
        run: |
          cd ./MyService
          ./gradlew jacocoTestReport

      - name: Build and analyze with SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd ./MyService
          ./gradlew sonar

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./MyService/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Build Docker image
        run: |
          docker build -t myservice:latest -f MyService/Dockerfile .

      - name: Verify Docker image
        run: |
          docker images | grep myservice
          echo "✅ Docker image built successfully"

